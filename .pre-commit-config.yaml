# Runs before every local commit: `pip install -e ".[dev]"` then `pre-commit install` once.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # refuse a commit that contains a secret
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
